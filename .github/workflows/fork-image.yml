name: Fork image

# Builds the combined image for this fork's own deployment. It runs on its own
# after Fork CI passes on main (so after a merged pull request), or by hand
# (Actions → Fork image → Run workflow, or `gh workflow run fork-image.yml`).
# Nothing deploys until dokku-infra points at the new tag.
on:
  workflow_run:
    workflows: [Fork CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit to build
        default: main
        required: true

permissions:
  contents: read
  packages: write

concurrency:
  group: fork-image
  cancel-in-progress: false

jobs:
  build:
    # After Fork CI: only when its run on a push to main passed.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The commit Fork CI checked, not whatever main is by now.
          ref: ${{ inputs.ref || github.event.workflow_run.head_sha }}
          persist-credentials: false
      # Tagged <app version>-gb-<short commit>, so each build names its source.
      - name: Image tag
        id: tag
        run: echo "tag=$(jq -r .version package.json)-gb-$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
      # Alpine replaced nginx 1.30.4 with a 1.30.x patch release; the source
      # Dockerfile still pins the old patch version.
      - name: Accept current nginx 1.30 patch release
        run: sed -i 's/nginx=~1\.30\.4/nginx=~1.30/' Dockerfile.kaneo && grep -n "nginx=" Dockerfile.kaneo
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.kaneo
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/kaneo:${{ steps.tag.outputs.tag }}
      - name: Report the tag
        run: echo "Built ghcr.io/${{ github.repository_owner }}/kaneo:${{ steps.tag.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
