# A missing chunk must stay a short-lived 404: CDNs and the service worker
# cache by URL, so a cached miss would break that build until it expires.
# The worker script is revalidated so a deploy reaches open apps quickly.
map "$status $uri" $kaneo_cache_control {
    "~^404 /assets/" "no-store";
    "~^\d+ /sw\.js$" "no-cache";
    default "";
}

# HSTS only for requests that reached the proxy over HTTPS. Behind a
# Cloudflare tunnel the hop to the container is plain HTTP, so CF-Visitor
# carries the visitor's scheme. A direct HTTP or LAN visit gets no header.
map "$http_x_forwarded_proto $http_cf_visitor" $kaneo_hsts {
    "~https" "max-age=31536000";
    default "";
}

server {
    listen 5173;
    server_name localhost;

    # The API logs its own requests; per-request lines and health probes from
    # nginx would interleave with them in the same container output.
    access_log off;

    # Allow larger OAuth/Better Auth session cookies in request headers.
    client_header_buffer_size 8k;
    large_client_header_buffers 4 32k;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "0" always;
    add_header Cache-Control $kaneo_cache_control always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security $kaneo_hsts always;
    # The hash covers the inline analytics loader in index.html. http: and ws:
    # keep a separately hosted plain-HTTP API working; HTTPS pages still block
    # mixed content.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-WkZBoLkZPdHsgpKBTf/ZCZZyKs1lIabbxqL/9Cf+bWA=' 'wasm-unsafe-eval' https://plausible.kaneo.app; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https: http:; font-src 'self' data:; connect-src 'self' https: wss: http: ws:; media-src 'self' data: blob: https: http:; worker-src 'self' blob:; frame-src 'self' https:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
    client_max_body_size 25m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_comp_level 6;

    location = /.well-known/oauth-protected-resource/api/mcp {
        proxy_pass http://127.0.0.1:1337/.well-known/oauth-protected-resource/api/mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header X-Kaneo-Client-IP "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /.well-known/oauth-authorization-server/api {
        proxy_pass http://127.0.0.1:1337/.well-known/oauth-authorization-server/api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header X-Kaneo-Client-IP "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /.well-known/ {
        return 404;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:1337/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header X-Kaneo-Client-IP "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Defense in depth if a build leaves a source map in the static directory.
    location ~* \.map$ {
        return 404;
    }

    # Hashed assets never fall back to index.html: a page from one deploy
    # asking for a chunk from another must fail as a 404, not get HTML.
    location /assets/ {
        root /var/lib/kaneo/html;
        try_files $uri =404;
    }

    location / {
        root /var/lib/kaneo/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
